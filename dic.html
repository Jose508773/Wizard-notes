<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="dic-page">
    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="dic.html" class="active">Dictionary</a>
        <a href="t.html">Testing</a>
        <a href="time.html">Time</a>
    </nav>

    <header class="banner">
        <h1>Wizard Dictionary</h1>
    </header>

    <main class="dic-main">
        <!-- Add Word Card -->
        <section class="dic-card">
            <h2>📝 Add a Word</h2>
            <form class="dic-form">
                <div class="input-group">
                    <input type="text" id="word" placeholder="Enter a word" required>
                    <input type="text" id="word-def" placeholder="Enter the definition" required>
                </div>
                <button type="submit" id="add-word-btn" class="dic-btn dic-btn-primary">
                    <span>Add Word</span>
                </button>
                <p id="word-result" class="dic-status"></p>
            </form>
        </section>

        <!-- Words List Card -->
        <section class="dic-card">
            <div class="dic-card-header">
                <h2>📖 Your Words</h2>
                <button id="get-words-btn" class="dic-btn dic-btn-secondary">Refresh</button>
            </div>
            <div id="words-result" class="words-list"></div>
        </section>
    </main>

    <footer class="dic-footer">
        <p>Powered by Vercel</p>
    </footer>

    <script src="dic.js"></script>
</body>

</html>
