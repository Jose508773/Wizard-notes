<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Wizard Notes</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <nav class="top-nav">
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="dic.html">Dictionary</a>
        <a href="t.html">Testing</a>
        <a href="time.html">Time</a>
    </nav>

    <div class="login-card">
        <h1>🧙‍♂️ Wizard Notes</h1>
        <p class="subtitle">Sign in to continue</p>


        <!-- Google OAuth -->
        <button class="oauth-btn" id="google-login-btn">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" />
                <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Continue with Google
        </button>



        <!-- Email form -->
        <form id="email-login-form">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
            <button type="submit" class="email-submit-btn">Sign in with Email</button>
        </form>

        <p class="footer-text">
            Don't have an account? <a href="#">Sign up</a>
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        // After Google sign-in completes, redirect to dictionary
        db.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_IN" && session) {
                window.location.href = "/dic.html";
            }
        });

        // Google OAuth login
        const googleBtn = document.getElementById("google-login-btn");
        if (googleBtn) {
            googleBtn.addEventListener("click", async () => {
                const { error } = await db.auth.signInWithOAuth({
                    provider: "google",
                    options: {
                        redirectTo: window.location.origin + "/index.html",
                        queryParams: { prompt: "select_account" }
                    }
                });
                if (error) alert("Sign-in failed: " + error.message);
            });
        }
    </script>


    <!-- Background Audio -->
    <div class="audio-controls"
        style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;">
        <audio id="bg-audio" loop>
            <source src="Whispers_of_the_Verdant_Grove.mp3" type="audio/mpeg">
        </audio>
        <button id="audio-toggle"
            style="background: none; border: none; color: white; cursor: pointer; font-size: 24px;">🔇</button>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');
        const audioToggle = document.getElementById('audio-toggle');
        let isPlaying = false;

        audioToggle.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                audioToggle.textContent = '🔇';
            } else {
                audio.play();
                audioToggle.textContent = '🔊';
            }
            isPlaying = !isPlaying;
        });
    </script>
</body>

</html>
