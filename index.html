<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Python FastAPI on Vercel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="banner">
        <nav><a href="about.html">About</a></nav>
        <h1>Wizard Notes</h1>
    </header>

    <main>
        <p>Add your ideas here</p>
        <form id="notes-form">
            <input type="text" id="users-notes" placeholder="Enter your ideas">
            <button type="submit" id="add-btn">Add</button>
            <p id="notes-result"> </p>
        </form>

        <button id="get-people-btn">Get People</button>
        <p id="people-result-get"></p>

    </main>








    <footer>
        <p>Powered by Vercel</p>
    </footer>



    <script src="script.js"></script>
</body>

</html>
