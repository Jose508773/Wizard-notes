<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test_ing</title>
    <link rel="stylesheet" href="test_ing.css">
</head>

<body>
    <div class="container">
        <h1>Test_ing</h1>

        <a href="time.html">time</a>

        <!-- API Test -->
        <div class="section">
            <p class="section-title">API Test</p>
            <button id="test-btn" class="btn btn-primary">Test Connection</button>
            <div id="test-result" class="result">—</div>
        </div>

        <hr>

        <!-- Add Person -->
        <div class="section">
            <p class="section-title">Add Person</p>
            <form id="person-form">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" class="form-input" id="name-input" placeholder="Name">
                    </div>
                    <div class="form-group">
                        <input type="number" class="form-input" id="age-input" placeholder="Age">
                    </div>
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
            <div id="person-result" class="result">—</div>
        </div>

        <hr>

        <!-- Show People -->
        <div class="section">
            <p class="section-title">People</p>
            <button id="show-people-btn" class="btn">Show People</button>
            <div id="people-result" class="result">—</div>
        </div>
    </div>

    <script src="test_ing.js"></script>
</body>

</html>
